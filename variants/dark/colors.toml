mode = "dark"

# In-game variant: the panels themselves, not the space scenery.
#
# Two readings are in play. The UI archives (Bilibili opus 1256332716420366418,
# 1251580820439695369) sample the shipped panels at neutral *warm* near-black
# (#1E1E19, #232323) under warm off-white text (#ECEAEB, #F3F2E8). The
# third-party wiki the owner pointed at (fz.wiki — see ASSETS.md) reads the same
# screens cool: blue-black #111827 / #181818 with holographic mint #00C7BD /
# #009E96 / #33E0D8. This variant follows the wiki — cool field, holographic
# cyan — with the site's own mint #00FFA2 kept one step brighter.
#
# This is a variant, not a second theme: the theme directory's own overrides
# (shell.bar/menu/launcher/popups.toml, chromium.theme) hold the paper values, so
# the whole set travels together — copying colors.toml alone leaves the shell and
# the Chromium frame on paper while the terminals go dark. Copy every file and
# re-apply (README, "Dark variant"):
#   cp variants/dark/* ~/.config/omarchy/themes/theme-endfield/
# Gates:
#   uv run check-contrast.py variants/dark && uv run check-variant.py

