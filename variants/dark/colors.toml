mode = "dark"

# In-game variant: the panels themselves, not the space scenery.
#
# The UI archives referenced in ASSETS.md (Bilibili opus 1256332716420366418
# and 1251580820439695369) sample as neutral near-black fields — #1E1E19,
# #232323, #191A1A, #202124 — under warm off-white text (#ECEAEB, #F3F2E8),
# with signal yellow filled behind the selected tab or the confirm button and
# the cool mint/blue kept for holographic accents.
#
# This is a variant, not the shipped theme: Omarchy reads colors.toml from the
# theme directory, so to use it copy this file over the theme's colors.toml and
# re-run `omarchy theme set endfield`. Gate it with:
#   uv run check-contrast.py variants/dark

accent = "#FFFA00"
selection = "#3B3B31"
muted = "#8A8880"

background = "#1E1E19"
dark_background = "#191A1A"
darker_background = "#0A0A08"
lighter_background = "#2A2A26"

foreground = "#ECEAEB"
dark_foreground = "#A9A69F"
light_foreground = "#C9C6C0"
bright_foreground = "#F6F4EF"

red = "#FF6A4D"
yellow = "#FFFA00"
orange = "#E0A05A"
green = "#8FCB6B"
cyan = "#00FFA2"
blue = "#6FA8D6"
magenta = "#FF5CC8"
brown = "#C0A488"

bright_red = "#FF8A73"
bright_yellow = "#FFF84D"
bright_green = "#B0E28F"
bright_cyan = "#5CFFC4"
bright_blue = "#9CC8EA"
bright_magenta = "#FF8AD8"
