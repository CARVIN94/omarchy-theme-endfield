mode = "light"

# Palette derived from the official Arknights: Endfield site
# (https://endfield.hypergryph.com) — see ASSETS.md for how each value was
# measured. Values marked "derived" are shaded from a measured signal colour so
# that they stay legible on paper white; check-contrast.py enforces that.
#
# The bright row is one step *lighter* than the colour it brightens, the same
# direction for every hue: bold text and the ANSI bright slots read as a softer
# step, not as a second hue. check-contrast.py fails a bright value that is
# darker than its base. Yellow has almost no room on paper — #8A6A00 is the
# lightest gold that still clears 4.5:1 — and it is shaded from the wiki's own
# "Endfield 黄" amber (#f2cc00 / #d9ad00, ASSETS.md).

accent = "#7D6B00"
selection = "#FFFA00"
muted = "#72706A"

background = "#F6F5EF"
dark_background = "#EDEBE1"
darker_background = "#E2DFD3"
lighter_background = "#FDFDFA"

foreground = "#191919"
dark_foreground = "#6A685F"
light_foreground = "#3A3A36"
bright_foreground = "#0A0A0A"

red = "#A8241A"
